[build]
  functions = "netlify/functions"
  publish = "."
  # El flash del mercado se sirve en vivo desde netlify/functions/flash-live.js
  # (lee directo de GitHub), asi que un commit que SOLO toca data/flash.json
  # no necesita reconstruir el sitio entero. Esto permite que el bot publique
  # cada pocos minutos sin gastar minutos de build de Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data/flash.json'"

# El sitemap se genera al vuelo desde los JSON publicados: cada noticia nueva
# entra al mapa sola, sin regenerar archivos.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# El service worker y el manifiesto nunca deben quedarse cacheados: si se
# guardan, el navegador seguiria usando una version vieja de la app instalada.
# Caché largo para estáticos: los JS/CSS van versionados (?v=N), así que un
# cambio siempre llega por URL nueva; iconos e imágenes casi no cambian.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
